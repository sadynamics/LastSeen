name: lastseen

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: lastseen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastseen
      POSTGRES_PASSWORD: lastseen_dev
      POSTGRES_DB: lastseen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastseen -d lastseen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lastseen-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lastseen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lastseen
      MINIO_ROOT_PASSWORD: lastseen_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lastseen lastseen_dev;
      mc mb --ignore-existing local/baileys-auth;
      mc mb --ignore-existing local/uploads;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
